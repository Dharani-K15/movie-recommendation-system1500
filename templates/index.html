<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommendation System</title>

    <!-- IMPORTANT: Render-safe CSS link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Top Banner -->
<div class="banner">
    🚀 Movie Recommendation System — Live 🚀
</div>

<h1>🎬 Movie Recommendation System</h1>

<form method="POST">
    <input
        type="text"
        name="movie"
        placeholder="Type a movie name (e.g. Avatar)"
        required
    >
    <button type="submit">Recommend</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% if recommendations %}
<h2 style="text-align:center; margin-top:20px;">Recommended Movies</h2>

<div class="movies">
    {% for movie in recommendations %}
    <div class="movie-card">
        <h3>🎥 {{ movie }}</h3>
    </div>
    {% endfor %}
</div>
{% endif %}

</body>
</html>
