<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Recommendation System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="banner">
  🎬 Movie Recommendation System — Live
</div>

<h1>Discover Movies You’ll Love</h1>

<form method="POST">
  <input type="text" name="movie" placeholder="Search a movie (Avatar, Titanic...)" required>
  <button type="submit">Recommend</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

{% if recommendations %}
<div class="movies">
  {% for movie in recommendations %}
  <div class="movie-card">

    {% if movie.poster %}
      <img src="{{ movie.poster }}" alt="{{ movie.title }}">
    {% else %}
      <!-- DEFAULT POSTER -->
      <img src="{{ url_for('static', filename='no-poster.png') }}" alt="No poster">
    {% endif %}

    <h3>{{ movie.title }}</h3>
    <p>{{ movie.overview }}</p>

  </div>
  {% endfor %}
</div>
{% endif %}

</body>
</html>
